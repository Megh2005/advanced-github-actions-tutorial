# This file documents the intended branch-protection policy for main.
# GitHub does not enforce branch protection from repository files alone.
# Apply these settings in repository Settings > Branches or via the API.

branch: main
required_status_checks:
  strict: true
  contexts:
    # Use exact check names from your repository checks UI.
    - CI / validate
    - CI / Static file checks
    - PR Governance / validate-governance
    - Security / npm-audit
required_pull_request_reviews:
  required_approving_review_count: 1
  dismiss_stale_reviews: true
  require_code_owner_reviews: true
  require_last_push_approval: false
restrictions: null
required_linear_history: true
allow_force_pushes: false
allow_deletions: false
block_creations: false
required_conversation_resolution: true
require_signed_commits: true
lock_branch: false
allow_fork_syncing: true
merge_queue_recommendation:
  enabled: true
  notes:
    - Configure merge queue in repository settings if your plan supports it.
    - Ensure merge_group trigger exists in required workflows.
