name: PR Governance

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name, PR title, and file policy
        if: ${{ github.event_name == 'pull_request_target' }}
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const branchPattern = /^(feat|fix|docs|chore|refactor|test|ci|hotfix)\/[a-z0-9._-]+$/;
            const titlePattern = /^(feat|fix|docs|chore|refactor|test|ci|build|perf|revert)(\(.+\))?!?:\s.+/;

            const failures = [];
            if (!branchPattern.test(pr.head.ref)) {
              failures.push(`Branch name \`${pr.head.ref}\` does not match ${branchPattern}.`);
            }

            if (!titlePattern.test(pr.title)) {
              failures.push('PR title must follow Conventional Commits format (e.g., feat(ci): add reusable workflow).');
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100
            });
            const changed = files.map((f) => f.filename);
            const changesWorkflow = changed.some((name) => name.startsWith('.github/workflows/'));
            const updatesWorkflowDocs = changed.includes('docs/WORKFLOWS.md');

            if (changesWorkflow && !updatesWorkflowDocs) {
              failures.push('Changes to .github/workflows/ must include a docs/WORKFLOWS.md update.');
            }

            const commitPattern = /^(feat|fix|docs|chore|refactor|test|ci|build|perf|style|revert)(\(.+\))?!?:\s.+/;
            const { data: commits } = await github.rest.pulls.listCommits({
              owner,
              repo,
              pull_number: pr.number,
              per_page: 250
            });
            for (const commit of commits) {
              const subject = commit.commit.message.split('\n')[0];
              if (/^Merge\b/.test(subject) || /^revert:/i.test(subject)) {
                continue;
              }
              if (!commitPattern.test(subject)) {
                failures.push(`Commit ${commit.sha.slice(0, 7)} subject is not Conventional Commits compliant: "${subject}"`);
              }
            }

            if (failures.length > 0) {
              core.setFailed(failures.join('\n'));
            }

      - name: Merge queue placeholder validation
        if: ${{ github.event_name == 'merge_group' }}
        run: echo "Merge queue event received; governance checks are handled in CI and PR workflows."
