name: Scheduled Maintenance

on:
  schedule:
    - cron: "45 5 * * 1"
  workflow_dispatch:

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run formatting, linting, and tests
        id: quality
        continue-on-error: true
        run: npm run check

      - name: Run local link checks
        id: links
        continue-on-error: true
        run: npm run check:links

      - name: Run security checks
        id: security
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Open or update maintenance issue when needed
        if: ${{ steps.quality.outcome == 'failure' || steps.links.outcome == 'failure' || steps.security.outcome == 'failure' }}
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Automated maintenance findings';
            const body = [
              'The weekly maintenance workflow found one or more issues.',
              '',
              `- quality: ${{ steps.quality.outcome }}`,
              `- links: ${{ steps.links.outcome }}`,
              `- security: ${{ steps.security.outcome }}`,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'maintenance',
              per_page: 100
            });

            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['maintenance', 'automated']
              });
            }
